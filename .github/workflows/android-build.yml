name: Android APK Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Build Android APKs
      run: gradle assembleDebug

    - name: Upload APK Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: android-apk-artifacts
        path: |
          src/Alphabet/build/outputs/apk/debug/*.apk
          src/NeonBlade/build/outputs/apk/debug/*.apk
          src/QuantumGrid/build/outputs/apk/debug/*.apk
          src/PixelQuest/build/outputs/apk/debug/*.apk
          src/EchoRider/build/outputs/apk/debug/*.apk
        if-no-files-found: warn
