name: Android Build & Play Store Publish

on:
  push:
    branches: [ "release" ] # Triggers when pushing to the release branch
  workflow_dispatch:      # Allows manual trigger from GitHub UI

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Gradle
      run: |
        sudo apt-get update
        sudo apt-get install -y gradle

    - name: Setup Gradle Cache
      uses: gradle/actions/setup-gradle@v3

    - name: Build Release App Bundles (AAB)
      run: gradle bundleRelease

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: release-aab-artifacts
        path: |
          src/Alphabet/build/outputs/bundle/release/*.aab
          src/NeonBlade/build/outputs/bundle/release/*.aab
          src/QuantumGrid/build/outputs/bundle/release/*.aab
          src/PixelQuest/build/outputs/bundle/release/*.aab
          src/EchoRider/build/outputs/bundle/release/*.aab
        if-no-files-found: warn

