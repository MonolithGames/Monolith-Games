name: Monolith Android CI/CD & Play Store Publish

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Build Android Game Bundles (.aab)
      run: |
        echo "Building Monolith Android Game Suites..."
        # ./gradlew bundleRelease

    - name: Publish to Google Play Console via Android Publisher API
      env:
        GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
      run: |
        echo "Executing Monolith.Publish automated deployment..."
        dotnet publish platform/publishing/Monolith.Publish/Monolith.Publish.csproj -c Release
        # dotnet run --project platform/publishing/Monolith.Publish/Monolith.Publish.csproj
