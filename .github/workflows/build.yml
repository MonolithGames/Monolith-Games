name: Console App Build (Windows)

permissions:
  contents: write

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install MinGW (Windows GCC)
      run: choco install mingw -y

    - name: Build Console App (Windows .exe)
      run: make

    - name: Move binary to build folder
      run: |
        if (!(Test-Path build)) { New-Item -ItemType Directory -Path build }
        Copy-Item console_app.exe build\

    - name: Commit build artifact back to repo
      run: |
        git config user.name "github-actions"
        git config user.email "actions@github.com"
        git add build/console_app.exe
        git commit -m "Automated Windows build"
        git push
