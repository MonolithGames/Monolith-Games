name: Monolith Web Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Build Monolith
      shell: pwsh
      run: |
        dotnet build web/Monolith.Web/Monolith.Web.csproj --configuration Release
        dotnet test web/Monolith.Web.Tests/Monolith.Web.Tests.csproj --configuration Release

    - name: Upload Monolith web artifacts
      uses: actions/upload-artifact@v4
      with:
        name: monolith-web
        path: web/Monolith.Web/bin/Release/net10.0/
        if-no-files-found: error
