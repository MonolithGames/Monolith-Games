name: Monolith Windows Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install MinGW (Windows GCC)
      run: choco install mingw -y

    - name: Build Monolith releases
      shell: pwsh
      run: |
        make VERSION=1 release
        make VERSION=2 release
        make VERSION=5 release

    - name: Upload Monolith releases
      uses: actions/upload-artifact@v4
      with:
        name: monolith-windows-releases
        path: build/Monolith_v*.exe
        if-no-files-found: error
