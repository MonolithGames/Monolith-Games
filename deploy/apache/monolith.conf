# Apache HTTPD reverse proxy for Monolith.
# Enable: proxy proxy_http proxy_wstunnel headers ssl rewrite

<VirtualHost *:80>
    ServerName monolith.example.com
    Redirect permanent / https://monolith.example.com/
</VirtualHost>

<VirtualHost *:443>
    ServerName monolith.example.com

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/monolith.example.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/monolith.example.com/privkey.pem

    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:65000/
    ProxyPassReverse / http://127.0.0.1:65000/

    # Blazor Server circuit/WebSocket support.
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule /(.*) ws://127.0.0.1:65000/$1 [P,L]

    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Host "monolith.example.com"

    ProxyTimeout 60
    ErrorLog ${APACHE_LOG_DIR}/monolith-error.log
    CustomLog ${APACHE_LOG_DIR}/monolith-access.log combined
</VirtualHost>
