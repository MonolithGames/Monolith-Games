<!DOCTYPE html>
<html>
<head>
    <style>body { margin: 0; background: #010409; overflow: hidden; }</style>
</head>
<body>
<canvas id="audioSea"></canvas>
<script>
    const canvas = document.getElementById('audioSea');
    const ctx = canvas.getContext('2d');
    let w = canvas.width = window.innerWidth, h = canvas.height = window.innerHeight;
    let count = 0;

    function draw() {
        ctx.fillStyle = 'rgba(1, 4, 9, 0.2)'; ctx.fillRect(0, 0, w, h);
        count += 0.05;

        ctx.lineWidth = 1.5;
        for(let i=0; i<6; i++) {
            ctx.strokeStyle = `rgba(0, ${150 + i*15}, ${200 + i*9}, 0.3)`;
            ctx.beginPath();
            ctx.moveTo(0, h/2);
            for(let x=0; x<=w; x+=20) {
                // Simulating high frequency music bouncing variables
                let simulatedFreq = Math.sin(x*0.005 + count + i) * (30 + i*10);
                ctx.lineTo(x, h/2 + simulatedFreq);
            }
            ctx.stroke();
        }
        requestAnimationFrame(draw);
    }
    window.addEventListener('resize', () => { w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight; });
    draw();
</script>
</body>
</html>
