<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Tower Defense — Monolith Store</title>
  <style>
    body{font-family:Inter,Arial,sans-serif;background:#0a0a0a;color:#fff;margin:0;padding:2rem}
    .game-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1rem}
    .card{background:#111;border:1px solid #222;padding:1rem;border-radius:8px}
    .title{font-weight:700;margin-bottom:.5rem}
    .desc{color:#aaa;font-size:.95rem}
  </style>
</head>
<body>
  <h1>Tower Defense</h1>
  <div id="list" class="game-list"></div>
  <script>
    fetch('/web-arcade/games/tower-defense/metadata.json').then(r=>r.json()).then(list=>{
      const root=document.getElementById('list');
      list.forEach(g=>{
        const div=document.createElement('div');div.className='card';
        div.innerHTML=`<div class="title">${g.title}</div><div class="desc">${g.description}</div><div style="margin-top:.8rem"><a href="/web-arcade/arcade/tower-defense/${g.slug}/" style="color:#fff;text-decoration:underline">Play</a></div>`;
        root.appendChild(div);
      });
    }).catch(e=>{document.getElementById('list').innerText='Failed to load metadata.'});
  </script>
</body>
</html>
