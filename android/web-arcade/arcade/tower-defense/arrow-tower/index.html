<!doctype html>
<html>
<head><meta charset="utf-8"><title>Arrow Tower — Monolith Arcade</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0;background:#071018;color:#fff;font-family:Inter,Arial,sans-serif}#canvas{width:100vw;height:100vh;display:block}</style></head>
<body>
<canvas id="canvas"></canvas>
<script src="https://unpkg.com/three@0.154.0/build/three.min.js"></script>
<script src="https://unpkg.com/three@0.154.0/examples/js/loaders/OBJLoader.js"></script>
<script src="/platform/web-arcade/shared/engine.js"></script>
<script>
 (async()=>{const canvas=document.getElementById('canvas');const renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setSize(window.innerWidth,window.innerHeight);const scene=new THREE.Scene();const camera=new THREE.PerspectiveCamera(45,window.innerWidth/window.innerHeight,0.1,1000);camera.position.set(0,2,6);scene.add(new THREE.AmbientLight(0xffffff,0.9));const dir=new THREE.DirectionalLight(0xffffff,0.6);dir.position.set(5,10,7);scene.add(dir);try{const obj=await PlatformEngine.loadModel('/platform/web-arcade/shared/models/placeholder.obj');obj.scale.set(1.5,1.5,1.5);obj.position.set(0,0,0);scene.add(obj);}catch(e){console.error(e)}function animate(){requestAnimationFrame(animate);scene.rotation.y+=0.002;renderer.render(scene,camera)}animate();window.addEventListener('resize',()=>{camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix();renderer.setSize(window.innerWidth,window.innerHeight)})})();
</script>
</body>
</html>
