<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tapper Liquidity Crisis</title>
    <style>
        body { background: #201510; color: #f59e0b; text-align: center; font-family: sans-serif; }
        canvas { background: #000; display: block; margin: 10px auto; border: 3px solid #f59e0b; }
    </style>
</head>
<body>
<h1>Tapper Liquidity Crisis™</h1>
<p>Serve assets to incoming clients down the lanes! Move with <b>Up/Down</b>, pour/push with <b>Spacebar</b>.</p>
<p><b>MSRP: $4.99 USD</b> (Proprietary Closed-Source License)</p>
<canvas id="g" width="400" height="400"></canvas>
<script>
    const canvas = document.getElementById('g'), ctx = canvas.getContext('2d');
    let laneY =, currentLane = 0, drinks = [], clients = [], score = 0, ticks = 0;

    window.addEventListener('keydown', e => {
        if (e.key === 'ArrowUp') currentLane = (currentLane + 2) % 3;
        if (e.key === 'ArrowDown') currentLane = (currentLane + 1) % 3;
        if (e.key === ' ' || e.key === 'Spacebar') drinks.push({ x: 320, y: laneY[currentLane] + 10 });
    });

    function loop() {
        ctx.clearRect(0, 0, 400, 400);
        ctx.fillStyle = '#78350f'; laneY.forEach(y => ctx.fillRect(40, y + 30, 320, 8)); // Bars

        if (ticks++ % 90 === 0) clients.push({ x: 40, y: laneY[Math.floor(Math.random()*3)] + 10 });

        ctx.fillStyle = '#38bdf8'; drinks.forEach((d, di) => { d.x -= 3; ctx.fillRect(d.x, d.y, 12, 16); }); // Cash assets

        ctx.fillStyle = '#ef4444';
        for (let c = clients.length - 1; c >= 0; c--) {
            clients[c].x += 0.5; ctx.fillRect(clients[c].x, clients[c].y, 16, 24); // Demanding clients
            if (clients[c].x > 320) { alert('Deficit Unresolved! Game Over.'); location.reload(); }

            drinks.forEach((d, di) => {
                if (Math.abs(d.x - clients[c].x) < 15 && d.y === clients[c].y) { clients.splice(c, 1); drinks.splice(di, 1); score += 50; }
            });
        }

        ctx.fillStyle = '#10b981'; ctx.fillRect(340, laneY[currentLane] + 10, 16, 24); // Server
        ctx.font = '16px sans-serif'; ctx.fillStyle = '#fff'; ctx.fillText('Dividends: ' + score, 20, 40);
        requestAnimationFrame(loop);
    }
    loop();
</script>
</body>
</html>
