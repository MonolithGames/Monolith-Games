<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Defender Data Escort</title>
    <style>
        body { background: #08020f; color: #ff0055; text-align: center; font-family: monospace; }
        canvas { background: #000; display: block; margin: 10px auto; border: 3px solid #ff0055; }
    </style>
</head>
<body>
<h1>Defender Data Escort™</h1>
<p>Fly and defend the perimeter! Move with <b>Arrow Keys</b>, tap <b>Spacebar</b> to fire your laser matrix.</p>
<p><b>MSRP: $4.99 USD</b> (Proprietary Closed-Source License)</p>
<canvas id="g" width="400" height="400"></canvas>
<script>
    const canvas = document.getElementById('g'), ctx = canvas.getContext('2d');
    let ship = { x: 50, y: 200, w: 25, h: 15 }, lasers = [], capturePods = [], ticks = 0, score = 0;

    window.addEventListener('keydown', e => {
        if (e.key === 'ArrowUp' && ship.y > 20) ship.y -= 15; if (e.key === 'ArrowDown' && ship.y < 360) ship.y += 15;
        if (e.key === 'ArrowLeft' && ship.x > 10) ship.x -= 15; if (e.key === 'ArrowRight' && ship.x < 200) ship.x += 15;
        if (e.key === ' ' || e.key === 'Spacebar') lasers.push({ x: ship.x + 25, y: ship.y + 6, w: 12, h: 3 });
    });

    function loop() {
        ctx.clearRect(0, 0, 400, 400);
        ctx.fillStyle = '#ff0055'; ctx.fillRect(ship.x, ship.y, ship.w, ship.h);

        if (ticks++ % 45 === 0) capturePods.push({ x: 400, y: Math.random()*340 + 20, speed: Math.random()*2 + 2 });

        ctx.fillStyle = '#00ffcc';
        for (let i = capturePods.length - 1; i >= 0; i--) {
            capturePods[i].x -= capturePods[i].speed;
            ctx.fillRect(capturePods[i].x, capturePods[i].y, 16, 16);
            if (capturePods[i].x < ship.x + 25 && Math.abs(capturePods[i].y - ship.y) < 16 && capturePods[i].x > ship.x) { alert('Systems Down!'); location.reload(); }
            if (capturePods[i].x < 0) capturePods.splice(i, 1);
        }

        ctx.fillStyle = '#ffff00';
        for (let l = lasers.length - 1; l >= 0; l--) {
            lasers[l].x += 8; ctx.fillRect(lasers[l].x, lasers[l].y, lasers[l].w, lasers[l].h);
            for (let i = capturePods.length - 1; i >= 0; i--) {
                if (lasers[l] && lasers[l].x > capturePods[i].x && lasers[l].x < capturePods[i].x + 16 && lasers[l].y > capturePods[i].y && lasers[l].y < capturePods[i].y + 16) {
                    capturePods.splice(i, 1); lasers.splice(l, 1); score += 100; break;
                }
            }
            if (lasers[l] && lasers[l].x > 400) lasers.splice(l, 1);
        }
        ctx.font = '14px monospace'; ctx.fillText('Score: ' + score, 20, 25);
        requestAnimationFrame(loop);
    }
    loop();
</script>
</body>
</html>
